name: Build EPUB & PDF with TOC Pages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install weasyprint

      - name: Build EPUB
        run: |
          cd "Final edits"
          zip -X0 "../CurlsAndContemplation-FINAL.epub" mimetype
          zip -Xr9D "../CurlsAndContemplation-FINAL.epub" META-INF OEBPS
          cp ../CurlsAndContemplation-FINAL.epub output/CurlsAndContemplation-FINAL.epub
          echo "EPUB built successfully"

      - name: Build PDF pass 1
        run: |
          cd "Final edits/pdf"
          python3 build-pod-pdf-royal.py
          echo "PDF pass 1 complete"

      - name: Extract page numbers from PDF
        run: |
          cd "Final edits"
          python3 << 'PYEOF'
import subprocess, re, json

pdf_path = "output/CurlsAndContemplation-KDP-ROYAL-FINAL.pdf"

# Get total pages
result = subprocess.run(["pdfinfo", pdf_path], capture_output=True, text=True)
pages_line = [l for l in result.stdout.splitlines() if "Pages:" in l]
total_pages = int(pages_line[0].split(":")[1].strip()) if pages_line else 0
print(f"Total pages: {total_pages}")

# Map of stem -> list of search strings (first unique text that appears on the chapter opening page)
# Order matters: put longer/more specific strings first; all comparisons are case-insensitive
search_map = {
    "4-Dedication":       ["for the dreamers", "dedication"],
    "5-SelfAssessment":   ["creative identity audit", "who are you"],
    "6-AffirmationOdyssey": ["affirmation odyssey", "daily affirmations worksheet"],
    "7-Preface":          ["preface"],
    "9-chapter-i":        ["unveiling your creative odyssey", "chapter i", "chapter 1"],
    "10-chapter-ii":      ["refining your creative toolkit", "chapter ii", "chapter 2"],
    "11-chapter-iii":     ["reigniting your creative fire", "chapter iii", "chapter 3"],
    "13-chapter-iv":      ["the art of networking", "chapter iv", "chapter 4"],
    "14-chapter-v":       ["cultivating creative excellence through mentorship", "chapter v", "chapter 5"],
    "15-chapter-vi":      ["mastering the business of hairstyling", "chapter vi", "chapter 6"],
    "16-chapter-vii":     ["embracing wellness and self-care", "chapter vii", "chapter 7"],
    "17-chapter-viii":    ["advancing skills through continuous education", "chapter viii", "chapter 8"],
    "19-chapter-ix":      ["stepping into leadership", "chapter ix", "chapter 9"],
    "20-chapter-x":       ["crafting enduring legacies", "chapter x\\b", "chapter 10"],
    "21-chapter-xi":      ["advanced digital strategies", "chapter xi\\b", "chapter 11"],
    "22-chapter-xii":     ["financial wisdom", "chapter xii\\b", "chapter 12"],
    "23-chapter-xiii":    ["embracing ethics and sustainability", "chapter xiii", "chapter 13"],
    "25-chapter-xiv":     ["the impact of ai on the beauty industry", "chapter xiv", "chapter 14"],
    "26-chapter-xv":      ["cultivating resilience and well-being", "chapter xv\\b", "chapter 15"],
    "27-chapter-xvi":     ["tresses and textures", "chapter xvi", "chapter 16"],
    "28-Conclusion":      ["conclusion"],
    "29-QuizKey":         ["quiz key", "quiz answer"],
    "30-SelfAssessment":  ["self-assessment worksheet", "self\\s*assessment\\s*worksheet"],
    "31-affirmations":    ["affirmations close", "closing affirmations"],
    "32-continued":       ["continued learning commitment", "continued learning"],
    "33-Acknowledgments": ["acknowledgments", "acknowledgements"],
    "34-AbouttheAuthor":  ["about the author"],
    "35-JournalingStart": ["journaling start", "begin your journal"],
    "36-ManifestingJournal": ["manifesting journal"],
    "37-journal":         ["journal page"],
    "38-professional":    ["professional development worksheet"],
    "39-SMARTGoals":      ["smart goals worksheet", "smart goals"],
    "40-self-care":       ["self-care journal", "self\\s*care\\s*journal"],
    "41-VisionJournal":   ["vision journal"],
    "42-DoodlePage":      ["doodle page", "doodle"],
    "43-bibliography":    ["bibliography", "references"],
}

# Extract full PDF text page by page
page_texts = {}
print("Extracting text from PDF pages...")
for page_num in range(1, total_pages + 1):
    res = subprocess.run(
        ["pdftotext", "-f", str(page_num), "-l", str(page_num), pdf_path, "-"],
        capture_output=True, text=True
    )
    page_texts[page_num] = res.stdout.lower().strip()

print(f"Extracted text from {len(page_texts)} pages")

page_map = {}
# For each TOC entry, find the FIRST page that contains any of the search strings
for stem, terms in search_map.items():
    for page_num in range(1, total_pages + 1):
        text = page_texts.get(page_num, "")
        matched = False
        for term in terms:
            # Use regex for word-boundary safe matching
            try:
                if re.search(term, text):
                    page_map[stem] = page_num
                    print(f"  {stem}: page {page_num} (matched: '{term}')")
                    matched = True
                    break
            except re.error:
                if term in text:
                    page_map[stem] = page_num
                    print(f"  {stem}: page {page_num} (matched literal: '{term}')")
                    matched = True
                    break
        if matched:
            break
    if stem not in page_map:
        print(f"  WARNING: {stem} not found in PDF")

with open("output/page-map.json", "w") as f:
    json.dump(page_map, f, indent=2)

print(f"\nMapped {len(page_map)} / {len(search_map)} entries")
PYEOF

      - name: Update TOC with page numbers
        run: |
          cd "Final edits"
          python3 << 'PYEOF'
import json, re

with open("output/page-map.json") as f:
    page_map = json.load(f)

toc_path = "OEBPS/xhtml/3-TableOfContents.xhtml"
with open(toc_path) as f:
    toc = f.read()

# Replace each toc-page-number span for the matching href
for stem, page_num in page_map.items():
    # Match the full toc-item div containing this href
    # Pattern: href="STEM.xhtml" or href="STEM-long-title.xhtml" (stem is a prefix match)
    # We need to match href="STEM..." then find the toc-page-number span
    escaped = re.escape(stem)
    # Match the anchor href starting with this stem (allows full filename)
    pattern = (
        r'(href="' + escaped + r'[^"]*"[^>]*>)'   # href attr
        r'(.*?)'                                    # link content
        r'(</a>s*<span class="toc-page-number">)' # closing tag + span open
        r'[^<]*'                                    # old page number (may be empty)
        r'(</span>)'                                # span close
    )
    replacement = rf'\1\2\3{page_num}\4'
    new_toc, count = re.subn(pattern, replacement, toc, flags=re.DOTALL)
    if count > 0:
        toc = new_toc
        print(f"  Set page {page_num} for {stem}")
    else:
        print(f"  WARNING: could not update TOC entry for {stem}")

with open(toc_path, "w") as f:
    f.write(toc)

populated = len(re.findall(r'toc-page-number">\d+<', toc))
print(f"\nTotal populated TOC entries: {populated}")
PYEOF

      - name: Rebuild PDF pass 2 with TOC page numbers
        run: |
          cd "Final edits/pdf"
          python3 build-pod-pdf-royal.py

      - name: Rebuild EPUB with updated TOC
        run: |
          cd "Final edits"
          rm -f output/CurlsAndContemplation-FINAL.epub
          zip -X0 "output/CurlsAndContemplation-FINAL.epub" mimetype
          zip -Xr9D "output/CurlsAndContemplation-FINAL.epub" META-INF OEBPS

      - name: Validate EPUB
        run: |
          wget -q https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck-5.1.0.zip
          java -jar epubcheck-5.1.0/epubcheck.jar "Final edits/output/CurlsAndContemplation-FINAL.epub" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: |
            Final edits/output/CurlsAndContemplation-FINAL.epub
            Final edits/output/CurlsAndContemplation-KDP-ROYAL-FINAL.pdf

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Final edits/output/" "Final edits/OEBPS/xhtml/3-TableOfContents.xhtml" "Final edits/pdf/print-interior-royal.html"
          git diff --cached --quiet || git commit -m "build: final EPUB+PDF with correct TOC page numbers"
          git push
