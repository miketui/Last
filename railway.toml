[build]
builder = "NIXPACKS"
watchPatterns = ["/web/**"]
buildEnvironment = "V3"

[deploy]
runtime = "V2"
numReplicas = 1
startCommand = "bash -lc 'export PATH=\"$HOME/.bun/bin:$PATH\" && cd web && bun run server.ts'"
sleepApplication = false
useLegacyStacker = false
multiRegionConfig = {"us-west2":{"numReplicas":1}}
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
